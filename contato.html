<!DOCTYPE html>
<html>
    <head>
            <title>Formulario - Entra21</title>
            <link rel="stylesheet" href="/assets/img/css/style.css">
    </head>
    <body>
        <form action="enviar-php" method="post">
            <div>
                <label for="nome_completo">Nome completo:</label>
                <input type="text" name="nome_completo" id="nome_completo" required>
            </div>
            <div>
                <label for="email_usuario">E-mail</label>
                <input type="email" name="email_usuario" id="email_usuario" required>
            </div>
            <div>
                <label for="telefone_usuario">Telefone</label>
                <input type="number" name="telefone_usuario" id="telefone_usuario" required>
            </div>
            <div>
                <label for="idade">Idade</label>
                
                <input type="number" name="idade" id="idade" required value="18" readonly>
            </div>
            <hr>
            <div>
                <label for="cidade">Cidade</label>
                <select name="cidade" id="cidade">
                    <option value="1" >Balneario camboriu</option>
                    <option value="2">itajai</option>
                    <option value="3" selected>itapema</option>
                    <option value="4">Camboriu</option>
                    <option value="5">Blumenau</option>
                </select>
            <div>
                <label for="mensagem">Mensagem</label>
                <textarea name="mensagem" id="mensagem" rows="5" maxlength="10"></textarea>
            </div>
            <div>
                    
                    
                    <label for="label_sexo">Sexo :</label>
                    </div>
                    <div>
                        <input type="radio" name="sexo" id="sexo_m" value="m">
                        <label for="sexo_m">Masculino</label>
                        
                    </div>
                    <div>
                        <input type="radio" name="sexo" id="sexo_f" value="f">
                        <label for="sexo_f">Feminino</label>
                    </div>
                    <div>
                        <input type="radio" name="sexo" id="sexo_o" value="o">
                        <label for="sexo_o">Outros</label>
                    
            </div>
            
            <div>
                <button type="submit">Enviar dados</button>
            </div>
        </form>
    </body>
</html>
